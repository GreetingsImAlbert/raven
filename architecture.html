<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raven 0 – System Architecture</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f2;--fg:#1c1d1f;--mute:#6c6d70;--card:#fff;--line:#d4d4cd;--ed:#3f6c99;--ep:#d97706;--eh:#8a8a92}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131416;--fg:#ecedee;--mute:#9a9ba0;--card:#1e2023;--line:#3a3c40;--ed:#8fb8e3;--ep:#f5a43a;--eh:#8d8f96}}
:root[data-theme="dark"]{--bg:#131416;--fg:#ecedee;--mute:#9a9ba0;--card:#1e2023;--line:#3a3c40;--ed:#8fb8e3;--ep:#f5a43a;--eh:#8d8f96}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}p.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;margin-bottom:10px}
.bar i{display:inline-block;width:24px;border-top:3px solid var(--c);vertical-align:3px;margin-right:5px}
.bar label{cursor:pointer;margin-left:auto}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.06)}
svg{display:block;min-width:820px;width:100%;height:auto}
svg text{fill:var(--fg);font-family:system-ui,sans-serif;pointer-events:none}
.n{cursor:pointer;transition:opacity .15s}.n rect.b{fill:var(--card);stroke-width:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.t{font-size:13px;font-weight:700}.s{font-size:10.5px;fill:var(--mute)!important}
.e{fill:none;stroke-width:2;transition:opacity .15s}.el{font-size:10.5px;fill:var(--mute)!important}
.eg{transition:opacity .15s}.dim{opacity:.12}
.av{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 5;pointer-events:all;cursor:pointer}
.ext{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 3}
.lg{display:none}.showlog .lg{display:block}
#info{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px;font-size:14px}
#info h3{margin:0 0 8px;font-size:16px}
.row{padding:7px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row b{font-size:14px}.in,.out{font-size:13px;color:var(--mute)}.out{color:var(--fg)}
</style>
</head>
<body>
<main>
<h1>Raven 0 – System Architecture</h1>
<p class="sub">Tap a system to isolate its links and see each subsystem's inputs and outputs.</p>
<div class="bar">
<span style="--c:var(--ed)"><i></i>Signal</span>
<span style="--c:var(--ep)"><i style="border-top-style:dashed"></i>Power</span>
<span style="--c:var(--eh)"><i style="border-top-style:dotted"></i>Physical</span>
<label><input type="checkbox" id="lg"> Show logging links</label>
</div>
<div class="wrap"><svg id="d" viewBox="0 0 960 530" role="img" aria-label="Raven 0 system architecture diagram">
<defs>
<marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ed)"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ep)"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--eh)"/></marker>
</defs>
<g id="L"></g>
</svg></div>
<div id="info"></div>
</main>
<script>
const COL={se:'#3b82f6',ctl:'#f59e0b',comms:'#14b8a6',saf:'#ef4444',pwr:'#84cc16',pt:'#a855f7',air:'#64748b',avi:'#94a3b8'};
const N={
comms:['Communications & Data',20,200,190,130,['Radio control','Video feed','Telemetry','Logging']],
pwr:['Power System',20,400,190,100,['Battery','PDB','Monitoring']],
se:['State Estimation',275,60,170,100,['Attitude + rates','Altitude · Ground distance','Absolute position','Relative position','Sensor fusion']],
saf:['Safety',275,230,170,90,['Failsafe','Procedures']],
ctl:['Control',500,150,140,170,['Mode manager (FSM)','Automator','Setpoint generator','Controller','Motor mixer']],
air:['Airframe',720,40,200,100,['Structure','Mounting interfaces']],
pt:['Powertrain',720,400,200,100,['ESC','Motors','Propellers']]};
const E=[
['pilot','comms','M70 110L70 200','s','user control\nsignals',76,146],
['comms','pilot','M160 200L160 110','s','video,\ntelemetry',166,146],
['comms','ctl','M210 205L500 205','s','sticks, mode, arm, link',312,219],
['comms','saf','M210 275L275 275','s','link status',214,270],
['se','ctl','M445 110L570 110L570 150','s','state estimate,\nhealth checks',577,128],
['se','saf','M300 160L300 230','s','health checks',306,190],
['saf','ctl','M445 270L500 270','s','failsafe\ntrigger',448,252],
['ctl','pt','M570 320L570 440L720 440','s','motor commands',582,434],
['pwr','pt','M210 470L720 470','p','regulated power',400,464],
['pwr','avi','M210 410L250 410','p','battery status · regulated power',258,405,['saf','ctl','se']],
['pt','air','M820 400L820 140','h','thrust, yaw\nreaction torque\n(physical)',828,262],
['air','se','M720 80L445 80','h','vehicle motion (sensed)',520,73],
['se','comms','M275 120L235 120L235 245L210 245','l'],
['saf','comms','M275 305L210 305','l'],
['ctl','comms','M520 320L520 360L150 360L150 330','l','to Logging',300,354],
['pwr','comms','M80 400L80 330','l']];
const D={
air:[['Structure','—','—'],['Mounting interfaces','component dimensions and mass','mounting points']],
pt:[['ESC','motor commands, regulated power','3-phase motor drive'],['Motors','3-phase motor drive','shaft torque'],['Propellers','shaft torque','thrust, yaw reaction torque']],
pwr:[['Battery','charge','battery power'],['PDB','battery power','regulated power'],['Monitoring','battery power','battery status']],
comms:[['Radio control','user control signals','stick positions, mode switch, arm state, link status'],['Video feed','camera video','transmit to ground station'],['Telemetry','time-stamped flight logs','transmit to ground station'],['Logging','state estimate, desired states, motor commands, sensor outputs, active flight mode, arm state, motor enable, battery status, failsafe trigger','time-stamped flight logs']],
saf:[['Failsafe','link status, state health checks, battery status','failsafe trigger'],['Procedures','—','pre-flight checklist, test plan and rules']],
se:[['Attitude + rates','IMU (acc, gyr, mag)','φ, θ, ψ, rates'],['Absolute altitude','barometer','z pos'],['Ground distance','ultrasonic','distance'],['Absolute position','GPS','x, y pos'],['Relative position (w.r.t. lower drone)','camera frames','rel. x, y, z pos'],['Sensor fusion','all outputs above','state estimate, state health checks']],
ctl:[['Mode manager (FSM)','mode switch, arm state, failsafe trigger, battery status, state health checks, touchdown flag, disarm request, link status','active flight mode, motor enable'],['Automator (landing, GPS hold)','active flight mode, state estimate','automated setpoints, touchdown flag, disarm request'],['Setpoint generator','active flight mode, stick positions, state estimate, automated setpoints','desired states'],['Controller','desired states, state estimate','thrust and torque commands'],['Motor mixer','thrust and torque commands, motor enable','motor commands']],
avi:[['Flight computer','—','hosts all software']]};
const T={comms:'Communications & Data',pwr:'Power System',se:'State Estimation',saf:'Safety',ctl:'Control',air:'Airframe',pt:'Powertrain',avi:'Avionics'};
const mk={s:'ms',p:'mp',h:'mh',l:'mh'},cl={s:'ed',p:'ep',h:'eh',l:'eh'};
let h=`<rect class="av" id="avi" x="250" y="20" width="415" height="400" rx="16"/><text class="t" x="264" y="42" style="fill:var(--mute)">AVIONICS</text><text class="s" x="332" y="42">Flight computer · hosts the software of the systems inside</text>
<g class="n" data-k="pilot"><rect class="ext" x="20" y="60" width="190" height="50" rx="10"/><text class="t" x="32" y="82">Pilot · Ground station</text><text class="s" x="32" y="97">external</text></g>`;
E.forEach((e,i)=>{const lab=(e[4]||'').split('\n').map((t,j)=>`<tspan x="${e[5]}" dy="${j?11:0}">${t}</tspan>`).join('');
h+=`<g class="eg ${e[3]=='l'?'lg':''}" data-i="${i}"><path class="e" d="${e[2]}" style="stroke:var(--${cl[e[3]]})${e[3]=='p'?';stroke-dasharray:7 4':e[3]=='h'||e[3]=='l'?';stroke-dasharray:2 4':''}" marker-end="url(#${mk[e[3]]})"/>${e[4]?`<text class="el" x="${e[5]}" y="${e[6]}">${lab}</text>`:''}</g>`});
Object.entries(N).forEach(([k,[t,x,y,w,hh,subs]])=>{h+=`<g class="n" data-k="${k}"><rect class="b" x="${x}" y="${y}" width="${w}" height="${hh}" rx="10" style="stroke:${COL[k]}"/><rect x="${x}" y="${y+10}" width="4" height="${hh-20}" rx="2" fill="${COL[k]}"/><text class="t" x="${x+14}" y="${y+22}">${t}</text>${subs.map((s,i)=>`<text class="s" x="${x+14}" y="${y+40+i*14}">${s}</text>`).join('')}</g>`});
document.getElementById('L').innerHTML=h;
const svg=document.getElementById('d'),info=document.getElementById('info');
const hint='Select a system to see its connections.';info.textContent=hint;
function reset(){svg.querySelectorAll('.n,.eg').forEach(e=>e.classList.remove('dim'));info.textContent=hint}
function pick(k){
svg.querySelectorAll('.eg').forEach(g=>{const e=E[g.dataset.i];g.classList.toggle('dim',!(e[0]==k||e[1]==k||(e[7]&&e[7].includes(k))))});
const keep=new Set([k]);E.forEach(e=>{if(e[0]==k||e[1]==k||(e[7]&&e[7].includes(k))){keep.add(e[0]);keep.add(e[1]);(e[7]||[]).forEach(x=>keep.add(x))}});
svg.querySelectorAll('.n').forEach(n=>n.classList.toggle('dim',!keep.has(n.dataset.k)));
info.innerHTML=`<h3 style="color:${COL[k]}">${T[k]}</h3>`+D[k].map(r=>`<div class="row"><b>${r[0]}</b><div class="in">← ${r[1]}</div><div class="out">→ ${r[2]}</div></div>`).join('')}
svg.querySelectorAll('.n').forEach(n=>{if(D[n.dataset.k])n.onclick=ev=>{ev.stopPropagation();pick(n.dataset.k)}});
document.getElementById('avi').onclick=ev=>{ev.stopPropagation();pick('avi')};
svg.onclick=reset;
document.getElementById('lg').onchange=ev=>document.querySelector('.wrap').classList.toggle('showlog',ev.target.checked);
</script>
</body>
</html>
