<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raven 0</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('raven-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#0a0b0e;--t1:#ffffff;--t2:#efeee9;--t3:#bcc0c7;--t4:#a0a5ae;--line:#555a64;--line2:#666b76;--amber:#ffb347;--ed:#c3cedd;--eh:#939aa6;--ep:#ffb347;--mute:#a0a5ae}
[data-theme="light"]{--bg:#fbfaf7;--t1:#000000;--t2:#15161a;--t3:#33363d;--t4:#4f535b;--line:#7d8189;--line2:#6a6e76;--amber:#a85a00;--ed:#26303c;--eh:#656b74;--ep:#a85a00;--mute:#4f535b}
#tm{position:fixed;top:max(16px,env(safe-area-inset-top));right:20px;background:none;border:0;padding:4px 0;font:400 13px "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;color:var(--t3);cursor:pointer;transition:color .2s;z-index:10}
#tm:hover,#tm:focus-visible{color:var(--amber);outline:none}
html,body{height:100%;margin:0}
html{background:var(--bg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--t3);text-decoration:none;font-weight:400;font-size:13px;letter-spacing:.06em;transition:color .2s}
a:hover,a:focus-visible{color:var(--amber);outline:none}
</style>
</head>
<body>
<button id="tm" aria-label="Toggle light and dark mode">Light</button>
<a href="overview.html">Raven - Overview</a>
<a href="architecture.html">Raven 0 - System Architecture</a>
<script>
(function(){var b=document.getElementById('tm'),r=document.documentElement;function s(){b.textContent=r.dataset.theme=='light'?'Dark':'Light'}s();b.onclick=function(){var t=r.dataset.theme=='light'?'dark':'light';r.dataset.theme=t;try{localStorage.setItem('raven-theme',t)}catch(e){}s()}})();
</script>
</body>
</html>
