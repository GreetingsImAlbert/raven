<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raven 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(60% 50% at 50% 55%,rgba(245,164,58,.07),transparent 70%),
    radial-gradient(40% 40% at 20% 20%,rgba(63,108,153,.10),transparent 70%),
    #0a0b0e;
  color:#e9e7e1;
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
a{
  position:relative;padding:.4em .1em;
  color:inherit;text-decoration:none;
  font-weight:300;font-size:clamp(18px,3.2vw,28px);letter-spacing:.14em;text-transform:uppercase;
  text-align:center;transition:color .3s,letter-spacing .4s;
}
a::after{
  content:"";position:absolute;left:0;bottom:-2px;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,#f5a43a,#8fb8e3,transparent);
  opacity:.55;transform:scaleX(.35);transition:transform .45s ease,opacity .3s;
}
a:hover,a:focus-visible{color:#fff;letter-spacing:.18em;outline:none}
a:hover::after,a:focus-visible::after{transform:scaleX(1);opacity:1}
</style>
</head>
<body>
<a href="architecture.html">Raven 0 - System Architecture</a>
</body>
</html>
